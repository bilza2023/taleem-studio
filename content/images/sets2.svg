<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter>
  <linearGradient id="head" x1="0" x2="1"><stop stop-color="#183b7a"/><stop offset="1" stop-color="#285aa8"/></linearGradient>
  <linearGradient id="aFill"><stop stop-color="#72c7ff" stop-opacity=".58"/><stop offset="1" stop-color="#4c8df5" stop-opacity=".38"/></linearGradient>
  <linearGradient id="bFill"><stop stop-color="#ff9bc7" stop-opacity=".52"/><stop offset="1" stop-color="#e86aaa" stop-opacity=".36"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<rect x="22" y="20" width="1556" height="105" rx="22" fill="url(#head)"/>
<text x="800" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Venn Diagram: Union and Intersection of Sets</text>
<text x="800" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#e9f0ff">Sets — Class 9 Mathematics</text>
<text x="800" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#183b7a"><tspan font-weight="700">A Venn diagram</tspan> shows the relationship between sets.</text>
<!-- left panel -->
<rect x="25" y="205" width="355" height="500" rx="22" fill="#fff8e6" filter="url(#shadow)"/>
<text x="55" y="250" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b7a">What do the regions mean?</text>
<rect x="55" y="285" width="42" height="42" rx="9" fill="#72c7ff" stroke="#3f9fe8" stroke-width="2"/>
<text x="115" y="310" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b7a">A only</text><text x="115" y="337" font-family="Arial,sans-serif" font-size="17" fill="#26364d">In A, but not in B</text>
<rect x="55" y="375" width="42" height="42" rx="9" fill="#ff9bc7" stroke="#e45ca7" stroke-width="2"/>
<text x="115" y="400" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b7a">B only</text><text x="115" y="427" font-family="Arial,sans-serif" font-size="17" fill="#26364d">In B, but not in A</text>
<rect x="55" y="465" width="42" height="42" rx="9" fill="#a89be9" stroke="#715ee1" stroke-width="2"/>
<text x="115" y="490" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b7a">A ∩ B</text><text x="115" y="517" font-family="Arial,sans-serif" font-size="17" fill="#26364d">Common to A and B</text>
<rect x="55" y="555" width="42" height="42" rx="9" fill="white" stroke="#a9bfdc" stroke-width="2"/>
<text x="115" y="580" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b7a">Outside</text><text x="115" y="607" font-family="Arial,sans-serif" font-size="17" fill="#26364d">In U, but neither A nor B</text>
<!-- central universal set -->
<rect x="405" y="205" width="765" height="500" rx="24" fill="#fbfdff" stroke="#244f91" stroke-width="3"/>
<text x="430" y="245" font-family="Georgia,serif" font-size="32" font-style="italic" fill="#183b7a">U</text>
<text x="650" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#245bb0">A</text>
<text x="930" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#a52d73">B</text>
<circle cx="650" cy="480" r="205" fill="url(#aFill)" stroke="#245bb0" stroke-width="4"/>
<circle cx="930" cy="480" r="205" fill="url(#bFill)" stroke="#a52d73" stroke-width="4"/>
<!-- elements -->
<g font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="middle">
<text x="565" y="400">1</text><text x="520" y="475">3</text><text x="610" y="540">5</text><text x="565" y="600">7</text>
<text x="790" y="435">4</text><text x="790" y="535">6</text>
<text x="1015" y="400">2</text><text x="1060" y="475">8</text><text x="1010" y="555">10</text>
<text x="470" y="650">9</text><text x="790" y="660">11</text><text x="1095" y="650">12</text>
</g>
<!-- right notation -->
<rect x="1195" y="205" width="380" height="500" rx="22" fill="#eef6ff" filter="url(#shadow)"/>
<text x="1385" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b7a">Set notation</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#17233a">
<rect x="1225" y="275" width="320" height="65" rx="13" fill="#d7efff"/><text x="1245" y="315">A = { 1, 3, 4, 5, 6, 7 }</text>
<rect x="1225" y="355" width="320" height="65" rx="13" fill="#ffe0ef"/><text x="1245" y="395">B = { 2, 4, 6, 8, 10 }</text>
<rect x="1225" y="435" width="320" height="80" rx="13" fill="#e7e1ff"/><text x="1245" y="468" font-weight="700">A ∩ B = { 4, 6 }</text><text x="1245" y="495" font-size="16">Intersection — common elements</text>
<rect x="1225" y="530" width="320" height="80" rx="13" fill="#dcf6e8"/><text x="1245" y="563" font-weight="700">A ∪ B = { 1,2,3,4,5,6,7,8,10 }</text><text x="1245" y="590" font-size="16">Union — elements in A or B</text>
<rect x="1225" y="625" width="320" height="55" rx="13" fill="#fff0c9"/><text x="1245" y="658" font-weight="700">A′ = elements not in A</text>
</g>
<!-- bottom -->
<rect x="25" y="745" width="1550" height="125" rx="22" fill="#eaf9f3" stroke="#b8ead8" stroke-width="2"/>
<text x="60" y="800" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b7a">Key ideas</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#26364d"><text x="220" y="785">✓ A ∩ B contains only the common elements.</text><text x="220" y="820">✓ A ∪ B contains all elements in either set.</text><text x="820" y="785">✓ Elements outside both circles belong to U but not A or B.</text><text x="820" y="820">✓ Venn diagrams make set relationships visible.</text></g>
</svg>
